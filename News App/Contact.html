<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Form</title>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background-color: #23d499;
                margin: 0;
                padding: 40px;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                box-sizing: border-box;
            }
            .form-container {
                background: rgb(47, 149, 193);
                padding: 30px 40px;
                border-radius: 24px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
                width: 100%;
                max-width: 400px;
            }
            h2 {
                text-align: center;
                color: #333;
                margin-bottom: 25px;
            }
            h2:hover{
                color: rgb(176, 46, 72);
            }
            form {
                display: flex;
                flex-direction: column;
                gap: 5px; /* Spacing between label and input */
            }
            label {
                margin-bottom: 5px;
                font-weight: 700;
                color: #0d0c0c;
            }
            input, textarea {
                padding: 12px;
                margin-bottom: 15px; /* Space below each input group */
                border: 3px solid #9e8888;
                border-radius: 8px;
                font-size: 1rem;
                transition: border-color 0.5s, box-shadow 0.6s;
            }
            input:focus, textarea:focus {
                outline: none;
                border-color: #28a745;
                box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.2);
            }
            button {
                padding: 10px 15px;
                background-color: #1eb140;
                color: white;
                border: none;
                border-radius: 12px;
                cursor: pointer;
                font-size: 1.1rem;
                font-weight: 600;
                transition: background-color 0.3s;
                margin-top: 10px;
            }
            button:hover {
                background-color: #195d27;
            }
            .error {
                color: red;
                font-size: 0.875rem;
                margin-top: -10px; /* Pull error message closer to input */
                margin-bottom: 10px;
                min-height: 1.2em; /* Reserve space to prevent layout shifts */
            }
            .success-message {
                color: green;
                margin-top: 10px;
            }
        </style>
    </head>
    <body>
        <div class="form-container">
            <h2>Contact Us</h2>
        
            <form id="contactForm">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
                <div id="nameError" class="error"></div>
        
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <div id="emailError" class="error"></div>
        
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4"></textarea>
                <div id="messageError" class="error"></div>
        
                <button type="submit">Submit</button>
            </form>
        
            <div id="successMessage" class="success-message" style="display:none;">
                Thank you! Your message has been received.
            </div>
        </div>
    
        <script>
            // Wait for the DOM to be fully loaded before running the script
            document.addEventListener('DOMContentLoaded', function () {
                
                // Get references to the form and other elements
                const contactForm = document.getElementById("contactForm");
                const successMessage = document.getElementById("successMessage");

                // Add a submit event listener to the form
                contactForm.addEventListener('submit', function (event) {
                    // Prevent the default form submission (which would reload the page)
                    event.preventDefault();

                    // Validate the form fields
                    const isValid = validateForm();

                    // If the form is valid, hide the form and show the success message
                    if (isValid) {
                        contactForm.style.display = "none";
                        successMessage.style.display = "block";
                    }
                });
            });

            /**
             * Validates the contact form fields (name, email, message).
             * @returns {boolean} - True if the form is valid, false otherwise.
             */
            function validateForm() {
                // Get form field values
                const name = document.getElementById("name").value.trim();
                const email = document.getElementById("email").value.trim();
                const message = document.getElementById("message").value.trim();
    
                // Get error message display elements
                const nameError = document.getElementById("nameError");
                const emailError = document.getElementById("emailError");
                const messageError = document.getElementById("messageError");
    
                // Reset previous error messages
                nameError.textContent = "";
                emailError.textContent = "";
                messageError.textContent = "";
    
                let isValid = true;
    
                // Validate Name
                if (name === "") {
                    nameError.textContent = "Name is required";
                    isValid = false;
                }
    
                // Validate Email
                if (email === "") {
                    emailError.textContent = "Email is required";
                    isValid = false;
                } else if (!isValidEmail(email)) {
                    emailError.textContent = "Invalid email format";
                    isValid = false;
                }
    
                // Validate Message
                if (message === "") {
                    messageError.textContent = "Message is required";
                    isValid = false;
                }
    
                return isValid;
            }
    
            /**
             * Checks if an email string is in a valid format.
             * @param {string} email - The email string to validate.
             * @returns {boolean} - True if the email format is valid, false otherwise.
             */
            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }
        </script>
    
    </body>
    </html>
