<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://png.pngtree.com/png-clipart/20230407/original/pngtree-best-quality-product-badge-logo-shape-png-image_9035045.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Favorites</title>
    <style>
        body { padding-top: 20px; }
        .card { margin-bottom: 20px; }
        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.7);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Favorite Articles</h1>
        <a href="Index.html" class="btn btn-primary mb-4">Back to Home</a>
        <div id="favorite-articles" class="row">
            <!-- Favorite articles will be displayed here -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            displayFavorites();
        });

        function displayFavorites() {
            const container = document.getElementById('favorite-articles');
            const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
            container.innerHTML = ''; // Clear existing content

            if (favorites.length === 0) {
                container.innerHTML = '<div class="col-12"><p>You have not saved any favorite articles yet.</p></div>';
            }else {
                favorites.forEach((article, index) => {
                    const cardHtml = `
                        <div class="col-md-4">
                            <div class="card">
                                <img src="${article.urlToImage || 'Image/placeholder.png'}" class="card-img-top" alt="News Image">
                                <div class="card-body">
                                    <h5 class="card-title">${article.title}</h5>
                                    <p class="card-text">${article.description || ''}</p>
                                    <a href="${article.url}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">Read More</a>
                                </div>
                                <button class="remove-btn" onclick="removeFromFavorites(${index})" title="Remove from favorites">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHtml;
                });
            }
        }

        function removeFromFavorites(index) {
            let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
            favorites.splice(index, 1); // Remove the article at the given index
            localStorage.setItem('favorites', JSON.stringify(favorites));
            displayFavorites(); // Re-render the favorites list
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
