        function setLanguage(lang) {
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
        });
            fetchNews(lang);
        }
    
        document.querySelectorAll('.lang-item').forEach(item => {
            item.addEventListener('click', (event) => {
                event.preventDefault();
                const selectedLang = event.target.getAttribute('data-lang');
                setLanguage(selectedLang);
    
              });
            });
       let currentLanguage = 'en';

            // Data Fetching
        function fetchNews(query, language = 'en') {
            const apiKey = 'a7fd61bacfa046b89e4f93fbeb403322';
            let apiUrl = `https://newsapi.org/v2/everything?language=${language}&sortBy=popularity&apiKey=${apiKey}`;
            if (query) apiUrl += `&q=${query}`;
    
            // fetch("https://newsapi.org/v2/everything?domains=wsj.com&apiKey=a7fd61bacfa046b89e4f93fbeb403322")
            fetch(apiUrl)
            .then(a=>a.json())
            .then(d=>{
          var fd=" ";
          d.articles.forEach((i) => {
            fd+=`
    

            <div class="cardm-3" style="width: 18rem;">
                <button class="favorite-btn top-left corner" onclick="toggleFavorite(this)">
            <i class="fas fa-heart"></i> 
         </button>
          <img src="${i.urlToImage}" class="card-img-top" alt="...">
          <div class="card-body">
      
         <h5 class="card-title"> ${i.title}</h5>
          <h5 class="card-title"> ${i.author}</h5>
        
          <h5 class="card-title"> ${i.description}</h5>
    
        
        
         <a href='${i.url}' class="btn btn-primary">Read More</a>
           </div>
         </div>
          `

          });
          document.getElementById("finaldata").innerHTML=fd;
         })
        
       .catch(error=>{
                    console.error("Error fetching news:", error);
                    document.getElementById("finaldata").innerHTML = "<p>Failed to load news. Please try again later.</p>";
                });
           
        }

        // Dark mode toggle functionality
        document.getElementById('darkModeToggle').addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
            });
    
    
            // Favorite button fuctionality
            function toggleFavorite(button) {
                const card = button.closest('.card');
                const article = {
                    url: card.querySelector('.btn').href,
                    title: card.querySelector('.card-title').textContent,
                    description: card.querySelector('.card-title').textContent,
                    urlToImage: card.querySelector('.card-img-top').src,
                };
                button.classList.toggle('active');
                saveFavorites(article);
            }

             // Initial load of news and language
            document.addEventListener('DOMContentLoaded', () => {
              setLanguage('en');
            });

            document.addEventListener('DOMContentLoaded', () => fetchNews({ country: 'us' }));
    
            function saveFavorites(article) {
                let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
                const articleIndex = favorites.findIndex(fav => fav.url === article.url);

                if (articleIndex > -1) {
                    favorites.splice(articleIndex, 1);
                    localStorage.setItem('favorites', JSON.stringify(favorites));

                } else {

                    favorites.push(article);
                    localStorage.setItem('favorites', JSON.stringify(favorites));

                }
            }


            document.getElementById('search-form').addEventListener('submit', function(event) {
                event.preventDefault();
                // fetchNews(currentLanguage, searchTerm);
                fetchNews(anonymous, currentLanguage)
            });
